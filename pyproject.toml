[project]
name = "lms-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Виталий Якимов",email = "fess.888@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "django-filter (>=26.2,<27.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "stripe (>=16.0.0,<17.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py", "tests_*.py"]
python_classes = ["Test*", "LMSAPITests"]
python_functions = ["test_*"]
